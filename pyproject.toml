[project]
name = "fire-for-your-dynasty"
version = "0.1.0"
description = "Compound interest analysis for generational wealth planning"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.3",
    "numpy>=2.2.6",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "polars>=0.20.0",
    "seaborn>=0.12.0",
    "pyyaml>=6.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
]

[project.scripts]
dynasty-fire = "dynasty_fire_main:main"
