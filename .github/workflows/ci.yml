name: CI

# Validation pipeline for pull requests and feature branches.
# Type-checks and builds the frontend; the deploy workflow (deploy.yml)
# handles publishing on `main`.

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend type-check & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install dependencies
        working-directory: web/frontend
        run: npm ci

      # `npm run build` runs `tsc` (type-check) and then `vite build`,
      # so a green build proves the production bundle compiles.
      - name: Build
        working-directory: web/frontend
        run: npm run build
